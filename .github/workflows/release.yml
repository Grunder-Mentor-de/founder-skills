# Baut aus jedem Ordner unter skills/ eine ZIP für claude.ai, sobald ein Tag gesetzt wird (z. B. v2026.10.16),
# und hängt sie an das GitHub-Release. Der oberste Ordner in der ZIP ist der Slug, so wie claude.ai es erwartet.
# Fester Link auf die neueste Fassung: https://github.com/<repository>/releases/latest/download/<slug>.zip
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pakete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ZIPs bauen
        run: |
          mkdir -p dist
          cd skills
          for ordner in */; do
            slug="${ordner%/}"
            [ -f "$slug/SKILL.md" ] || continue
            zip -r -X "../dist/$slug.zip" "$slug" -x '*/.*'
          done
          cd ..
          ls dist/*.zip >/dev/null 2>&1 || { echo "Keine Skills unter skills/, kein Release."; exit 1; }
          ls -l dist
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
